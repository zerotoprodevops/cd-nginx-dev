apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Welcome to mjs.com</title>
        <style>
            body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f0f8ff; }
            h1 { color: #2c3e50; }
            p { color: #34495e; }
        </style>
    </head>
    <body>
        <h1>Hello from mjs.com!</h1>
        <p>This page is being served from a Kubernetes ConfigMap.</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  name: dev-index-page
  namespace: default
