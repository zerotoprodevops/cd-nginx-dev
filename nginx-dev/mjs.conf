# ── Main server block ──
server {
    listen 80;
    listen [::]:80;

    server_name mjs.com;
    root /usr/share/nginx/html/mjs;  # Fixed to point to the Docker default folder
    index index.html;

    # ── Custom error pages ──
    error_page 404 /404.html;

    # ── Serve static files ──
    location / {
        try_files $uri $uri/ =404;
    }
}
